{% extends "layout.html" %}
{% block content %}
  <style>
    .sign-ext-disabled {
      background: #e9ecef;
      color: #6c757d;
      opacity: 0.95;
    }

    .sign-control-disabled {
      background: #e9ecef !important;
      color: #6c757d;
      cursor: not-allowed;
    }

    body.theme-color-midnight .sign-control-disabled {
      background: var(--surface-2) !important;
      color: var(--muted);
      border-color: var(--border);
    }
  </style>
  <div class="row mb-4">
    <div class="col">
      <h1 class="mb-3"><span class="product-name-display">{{ product_name }}</span> (R&D Only)</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-md-8">
      <h2>Submit a CSR</h2>
      <form method="POST" action="/submit" class="csr-form mb-4">
        <input type="hidden" name="policy_id" id="policy_id_submit" value="{{ selected_policy.id if selected_policy }}">
        <input type="hidden" name="no_extensions" id="no_extensions_submit" value="">
        <input type="hidden" name="use_csr_extensions" id="use_csr_extensions_submit" value="">
        <input type="hidden" name="validity_days_override" id="validity_days_override_submit" value="">
        <div class="form-group">
          <textarea id="csr_textarea" name="csr" rows="10" class="form-control" placeholder="Paste PEM-encoded CSR here..."></textarea>
        </div>
        <button type="submit" class="btn btn-success">Sign CSR</button>
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('csr_textarea').value = '';">Clear CSR</button>
      </form>

      <div class="mb-4">
        <h4>Load a Pending CSR Request</h4>
        <div class="input-group">
          <select id="csr_select" class="form-control">
            {% for req in csr_requests %}
              <option value="{{ req[2]|e }}">{{ req[1] }} (Created: {{ req[3] }})</option>
            {% endfor %}
          </select>
          <div class="input-group-append">
            <button type="button" class="btn btn-outline-secondary" onclick="loadCSR()">Load CSR into Form</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <h4>Select Enrollment Policy</h4>
      <a href="/ra_policies" class="btn btn-sm mb-2" style="background-color: #fd7e14; color: #fff;">Manage enrollment policies</a>
      <form id="server_ext_form">
        <div class="form-group">
          <select id="server_ext_select" name="server_ext_select" class="form-control">
            {% for p in ra_policies %}
              {% set owner = p.user_name if p.user_name else current_user.username %}
              <option value="{{ p.id }}" data-validity="{{ p.validity_period }}">
                {{ p.name }}{% if p.type == 'user' %} (User {{ owner }}){% else %} (System){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
      </form>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="no_extensions">
        <label class="form-check-label" for="no_extensions">No extensions for this signing action</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="use_csr_extensions">
        <label class="form-check-label" for="use_csr_extensions">Use CSR extensions for this signing action</label>
      </div>
      <h4 class="mt-3">Extension</h4>
      <pre id="server_ext_content" class="server-ext-content">Select a config to view its content.</pre>

      <h4>Validity Period</h4>
      <div class="form-group">
        <input type="text" id="validity_days" class="form-control" value="{{ validity_days|default('365') }}" readonly>
      </div>
    </div>
  </div>

  <script>
    function loadCSR() {
      var select = document.getElementById('csr_select');
      var csrText = select.value;
      document.getElementById('csr_textarea').value = csrText;
    }

    document.addEventListener('DOMContentLoaded', function() {
      var signForm = document.querySelector('form.csr-form');
      var select = document.getElementById('server_ext_select');
      var content = document.getElementById('server_ext_content');
      var validityInput = document.getElementById('validity_days');
      var policySubmit = document.getElementById('policy_id_submit');
      var validityOverrideSubmit = document.getElementById('validity_days_override_submit');
      var noExtensionsSubmit = document.getElementById('no_extensions_submit');
      var useCsrExtensionsSubmit = document.getElementById('use_csr_extensions_submit');
      var noExtensions = document.getElementById('no_extensions');
      var useCsrExtensions = document.getElementById('use_csr_extensions');
      var defaultValidity = '365';

      function syncSubmitFields() {
        if (noExtensionsSubmit) {
          noExtensionsSubmit.value = (noExtensions && noExtensions.checked) ? 'on' : '';
        }
        if (useCsrExtensionsSubmit) {
          useCsrExtensionsSubmit.value = (useCsrExtensions && useCsrExtensions.checked) ? 'on' : '';
        }
        if (validityOverrideSubmit && validityInput) {
          validityOverrideSubmit.value = validityInput.value || '';
        }
        if (policySubmit && select && !select.disabled) {
          policySubmit.value = select.value;
        }
      }

      function updateContent() {
        syncSubmitFields();
        if (noExtensions && useCsrExtensions) {
          if (this === noExtensions && noExtensions.checked) {
            useCsrExtensions.checked = false;
            if (useCsrExtensionsSubmit) useCsrExtensionsSubmit.value = '';
          }
          if (this === useCsrExtensions && useCsrExtensions.checked) {
            noExtensions.checked = false;
            if (noExtensionsSubmit) noExtensionsSubmit.value = '';
          }
        }
        if (noExtensions && noExtensions.checked) {
          if (select) {
            select.disabled = true;
            select.classList.add('sign-control-disabled');
          }
          content.textContent = '[ v3_ext ]';
          content.classList.add('sign-ext-disabled');
          if (validityInput) {
            validityInput.readOnly = false;
            validityInput.value = defaultValidity;
            validityInput.classList.remove('sign-control-disabled');
          }
          return;
        }
        if (useCsrExtensions && useCsrExtensions.checked) {
          if (select) {
            select.disabled = true;
            select.classList.add('sign-control-disabled');
          }
          content.textContent = '[ CSR requested extensions ]';
          content.classList.add('sign-ext-disabled');
          if (validityInput) {
            validityInput.readOnly = false;
            validityInput.classList.remove('sign-control-disabled');
          }
          return;
        }
        if (select) {
          select.disabled = false;
          select.classList.remove('sign-control-disabled');
        }
        if (!select || select.options.length === 0) {
          content.textContent = '# No policy available';
          content.classList.remove('sign-ext-disabled');
          if (validityInput) {
            validityInput.readOnly = true;
            validityInput.value = '{{ validity_days|default("365") }}';
            validityInput.classList.add('sign-control-disabled');
          }
          return;
        }
        var val = select.value;
        if (policySubmit) policySubmit.value = val;
        var selectedOption = select.options[select.selectedIndex];
        if (selectedOption && selectedOption.dataset && selectedOption.dataset.validity) {
          validityInput.value = selectedOption.dataset.validity;
        }
        if (validityInput) {
          validityInput.readOnly = true;
          validityInput.classList.add('sign-control-disabled');
        }
        fetch('/get_server_ext_content?policy_id=' + encodeURIComponent(val))
          .then(r => r.ok ? r.text() : 'Error loading config')
          .then(txt => {
            content.classList.remove('sign-ext-disabled');
            content.textContent = txt;
          });
      }

      if (select) {
        select.addEventListener('change', updateContent);
      }
      if (noExtensions) {
        noExtensions.addEventListener('change', updateContent);
      }
      if (useCsrExtensions) {
        useCsrExtensions.addEventListener('change', updateContent);
      }
      if (validityInput) {
        validityInput.addEventListener('input', function() {
          if (validityOverrideSubmit) {
            validityOverrideSubmit.value = validityInput.value || '';
          }
        });
      }
      if (signForm) {
        signForm.addEventListener('submit', function() {
          syncSubmitFields();
        });
      }
      updateContent();
    });
  </script>
{% endblock %}
